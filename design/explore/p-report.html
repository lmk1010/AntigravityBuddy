<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>日报 · H2 风格</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="rows.css"><link rel="stylesheet" href="light.css">
<style>
.kick{font-size:12.5px;color:var(--fg-3);letter-spacing:.04em}
.hi{font-size:36px;font-weight:450;letter-spacing:-.025em;line-height:1.15;margin-top:14px;font-variation-settings:"ROND" 20,"wdth" 100}
.say{font-size:15px;line-height:1.7;color:var(--fg-3);margin-top:14px;max-width:470px}
.say b{color:var(--fg);font-weight:450}
.st .kn{font-size:32px;margin-top:10px}
.st .vs{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.st .vs div{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--fg-4)}
.st .d{font-size:12.5px;color:var(--fg-3);margin-top:8px}.st .d b{font-weight:450;color:#3FB97D}
.tlr{display:grid;grid-template-columns:210px 1fr 90px;align-items:center;column-gap:16px;height:27px}
.tlr .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlr .tg{font-size:11.5px;color:var(--fg-4);margin-left:6px}
.tlr .v{font-size:12.5px;text-align:right;color:var(--fg-2)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);column-gap:14px;align-items:end;height:92px}
.wk>div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--fg-4)}
.wk .bar{width:100%;border-radius:8px}
.wk .on{color:var(--fg)}
.nt{border-radius:16px;padding:12px 14px;display:flex;gap:12px;background:var(--glass);box-shadow:0 0 0 1px var(--glass-border),0 18px 40px -14px rgb(0 0 0/.5)}
body.light .nt{box-shadow:0 0 0 1px rgb(0 0 0/.06),0 18px 40px -14px rgb(0 0 0/.18)}
.nt .ap{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4C8DF6,#8E7CF6);display:grid;place-items:center;flex:none}
.nt .t{font-size:13px;font-weight:550}.nt .b{font-size:12.5px;color:var(--fg-2);margin-top:2px}
.tg2{width:34px;height:20px;border-radius:10px;background:#2F71E3;position:relative;flex:none}.tg2:after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
</style></head><body><div id="app"></div>
<script src="shell.js"></script><script src="kit.js"></script><script src="art.js"></script><script src="ui.js"></script>
<script>
UI.tabs(1);
// 插画：黄昏。今天的活跃曲线是远山，太阳半落在地平线，水面有倒影
function dusk(W = 528, H = 176) {
  const G = 126, act = ART.smooth([0, .1, .5, .9, .8, .55, .3, .6, .85, .7, .95, .5, .2, .05], 1.2), X = i => i / (act.length - 1) * W;
  const hill = (k, off) => { const pts = act.map((v, i) => [X(i), G - v * 58 * k - off]); let d = `M0,${G}L0,${pts[0][1]}`; d += UI.curve(pts).replace(/^M[^C]*/, ''); return d + `L${W},${G}Z`; };
  const sx = X(11.3), sr = 44;
  let rays = ''; [78, 102, 128].forEach((r, i) => rays += `<path d="M${sx - r},${G} A${r},${r} 0 0 1 ${sx + r},${G}" fill="none" stroke="#F2B35B" stroke-opacity="${.22 - i * .06}" stroke-dasharray="${i ? '2 6' : ''}"/>`);
  let refl = ''; [[0, 104], [8, 78], [16, 54], [24, 32], [32, 16]].forEach(([dy, w]) => refl += `<rect x="${sx - w / 2}" y="${G + 10 + dy}" width="${w}" height="3" rx="1.5" fill="url(#sun)" opacity="${.75 - dy / 70}"/>`);
  let stars = ''; if (!UI.light) for (let i = 0; i < 18; i++) stars += `<circle cx="${D.rnd() * W}" cy="${D.rnd() * 60 + 4}" r="${D.rnd() * .9 + .4}" fill="#fff" opacity="${(D.rnd() * .4 + .1).toFixed(2)}"/>`;
  return `<svg width="${W}" height="${H}" style="display:block;overflow:hidden"><defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD59A"/><stop offset=".6" stop-color="#F7A35C"/><stop offset="1" stop-color="#F27A9B"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#F7A35C" stop-opacity=".35"/><stop offset="1" stop-color="#F7A35C" stop-opacity="0"/></radialGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E7CF6" stop-opacity=".95"/><stop offset="1" stop-color="#4C8DF6" stop-opacity="${UI.light ? .5 : .35}"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B9BFF" stop-opacity=".35"/><stop offset="1" stop-color="#5B9BFF" stop-opacity=".05"/></linearGradient>
    <clipPath id="up"><rect x="0" y="0" width="${W}" height="${G}"/></clipPath></defs>
    ${stars}<ellipse cx="${sx}" cy="${G}" rx="170" ry="70" fill="url(#glow)" clip-path="url(#up)"/>${rays}
    <path d="${hill(1.35, 6)}" fill="url(#h2)"/><circle cx="${sx}" cy="${G + 6}" r="${sr}" fill="url(#sun)" clip-path="url(#up)"/>
    <path d="${hill(1, 0)}" fill="url(#h1)"/>
    <line x1="0" x2="${W}" y1="${G}" y2="${G}" style="stroke:${UI.ink(.25)}"/>${refl}
    <text x="0" y="${G + 22}" style="fill:var(--fg-4);font-size:11.5px">09:00</text><text x="${W}" y="${G + 22}" text-anchor="end" style="fill:var(--fg-4);font-size:11.5px">19:00</text>
  </svg>`;
}
// 今天做了什么：工作时段 09:00–19:00 的会话时间轴
const SS = [['Casual Greeting', 'Neox', [[9.33, 11.67], [14, 15.17]], '3.00M', 0], ['Neox UI Design Optimization', 'Neox · 4 个子代理', [[11.83, 12.67]], '472K', 2], ['国考申论实时批改', 'PlanMD', [[13.17, 13.83]], '251K', 4], ['Server Deployment And File Transfer', 'Neox', [[15.5, 17.17]], '1.02M', 1], ['Future Trends And Personal Agent', 'Neox', [[17.33, 18.17]], '414K', 3]];
function band(spans, k, W = 640) {
  const X = h => (h - 9) / 10 * W;
  let s = ''; for (let h = 9; h <= 19; h++) s += `<line x1="${X(h)}" x2="${X(h)}" y1="0" y2="14" style="stroke:${UI.ink(h % 3 ? .04 : .08)}"/>`;
  spans.forEach(([a, b]) => s += `<rect x="${X(a)}" y="2" width="${X(b) - X(a)}" height="10" rx="5" fill="${ART.pal[k]}" data-tip='${a.toFixed(2).replace('.', ':').replace(/:(\d\d)/, (m, x) => ':' + String(Math.round(x * .6)).padStart(2, '0'))} – ${b.toFixed(2).replace('.', ':').replace(/:(\d\d)/, (m, x) => ':' + String(Math.round(x * .6)).padStart(2, '0'))}'/>`);
  return `<svg width="${W}" height="14" style="display:block">${s}</svg>`;
}
const WEEK = [['一', 5.2, 3.8], ['二', 7.1, 6.1], ['三', 6.4, 4.9], ['四', 6.3, 5.2], ['五', 0, 0], ['六', 0, 0], ['日', 0, 0]];
const cmp = (a, b, g) => `<div><span style="width:30px">今天</span>${UI.capsule(a, g, 180, 5)}</div><div><span style="width:30px">昨天</span>${UI.capsule(b, UI.G.gray, 180, 5)}</div>`;
const WEEKLY = UI.q.get('range') === 'week';
mount(`<div class="pg" style="position:relative;gap:30px;padding-top:30px">${UI.aura()}
  <section class="rw" style="height:180px">
    <div class="md" style="grid-column:span 6">
      <div class="row" style="justify-content:space-between"><span class="kick">11 月 20 日 · 周四 · 18:30</span></div>
      <div class="hi">今天辛苦了。</div>
      <div class="say">工作了 <b>6 小时 20 分</b>，和 Agent 一起推进了 <b>5 个会话</b>，完成 <b>411 次调用</b>，花费约 <b>$35.8</b>。比昨天多做了一个半小时。</div>
      <div class="row" style="gap:10px;margin-top:14px"><span class="seg"><span class="${WEEKLY ? '' : 'on'}">今天</span><span class="${WEEKLY ? 'on' : ''}">本周</span></span><span class="ibg"><span class="ib2" data-tip="复制为 Markdown">${UI.icon('ledger', 15)}</span><span class="ib2" data-tip="保存为图片">${UI.icon('report', 15)}</span></span></div>
    </div>
    <div class="md" style="grid-column:7 / span 6">${dusk()}</div>
  </section>
  <section class="rw st">
    ${[['工作时长', '6<small>h</small> 20<small>m</small>', [.63, .52], '<b>▲ 1h 10m</b> 比昨天', UI.G.gemini], ['真实消耗', '5.16<small>M</small>', [.85, .7], '<b>▲ 22%</b> 比昨天', UI.G.week], ['花费', '$35.8', [.72, .64], '<b>▲ 12%</b> 比昨天', UI.G.claude], ['缓存命中', '95.1<small>%</small>', [.951, .96], '<b style="color:#E8955E">▼ 1 个点</b> 比昨天', ['#3FA7C9', '#4FC3D9', '#7FD6E3']]].map(([l, v, [a, b], d, g]) => `<div class="md" style="grid-column:span 3"><div class="lb">${l}</div><div class="kn num">${v}</div><div class="vs">${cmp(a, b, g)}</div><div class="d num">${d}</div></div>`).join('')}
  </section>
  <section class="rw">
    <div class="md" style="grid-column:1/-1">
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="lb">今天做了什么 · 09:00 – 19:00</div><div class="lb" style="color:var(--fg-4)">5 个会话 · 2 个项目</div></div>
      ${SS.map(([n, t, sp, v, k]) => `<div class="tlr"><span class="nm">${n}<span class="tg">${t}</span></span>${band(sp, k, 750)}<span class="v num">${v}</span></div>`).join('')}
      <div class="tlr" style="height:20px"><span></span><div class="row num" style="justify-content:space-between;font-size:11.5px;color:var(--fg-4)">${[9, 11, 13, 15, 17, 19].map(h => `<span>${h}:00</span>`).join('')}</div><span></span></div>
    </div>
  </section>
  <section class="rw" style="height:128px">
    <div class="md" style="grid-column:span 7"><div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="lb">本周 · 已工作 25h 0m</div><div class="lb" style="color:var(--fg-4)">20.0M tokens · 约 $142</div></div>
      <div class="wk">${WEEK.map(([d, h, t], i) => `<div class="${i === 3 ? 'on' : ''}" data-tip="${h ? `周${d} · ${h}h · ${t}M tokens` : `周${d}`}"><span class="num" style="font-size:11.5px">${h ? h + 'h' : ''}</span><span class="bar" style="height:${h ? h / 7.1 * 52 : 4}px;background:${h ? (i === 3 ? 'linear-gradient(180deg,#8E7CF6,#4C8DF6)' : 'linear-gradient(180deg,rgb(91 155 255/.55),rgb(91 155 255/.2))') : UI.ink(.06)}"></span>周${d}</div>`).join('')}</div>
    </div>
    <div class="md" style="grid-column:9 / span 4"><div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="lb">下班提醒</div><span class="row" style="gap:8px;font-size:12.5px;color:var(--fg-3)">工作日 18:30<span class="tg2"></span></span></div>
      <div class="nt"><span class="ap">${BLOGO.replace('class="blogo"', 'style="display:grid;place-items:center"').replace('width="10" height="10"', 'width="18" height="18"').replace('#7BA7F2', '#fff')}</span><div style="flex:1;min-width:0"><div class="row" style="justify-content:space-between"><span class="t">Buddy</span><span style="font-size:11.5px;color:var(--fg-4)">18:30</span></div><div class="b">今天辛苦了，总结好了 🌇</div><div class="b" style="color:var(--fg-3)">6h 20m · 5 个会话 · 约 $35.8</div></div></div>
      <div style="font-size:12px;color:var(--fg-4);margin-top:12px">每周五 18:30 另外发一份周报</div>
    </div>
  </section>
</div>`, '');
</script></body></html>
