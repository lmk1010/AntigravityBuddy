<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>概览探索 E · 四列网格</title>
<link rel="stylesheet" href="base.css">
<style>
.body{padding:0}
.gd{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:176px 326px 1fr;gap:1px;background:var(--border);height:100%}
.cl{background:var(--background);padding:18px 24px;position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;height:20px;font-size:13px;color:var(--fg-3);flex:none}
.ch h3{color:var(--fg);font-size:14px}
.ch .m{font-size:12px;color:var(--fg-4);display:flex;align-items:center;gap:10px}
.ch .l{display:flex;align-items:center;gap:7px}
.kv{font-size:30px;font-weight:450;letter-spacing:-.02em;line-height:1;margin-top:12px;font-variation-settings:"ROND" 20,"wdth" 100}
.kv small{font-size:13px;color:var(--fg-4);font-weight:350;margin-left:4px;letter-spacing:0}
.kc{font-size:12.5px;color:var(--fg-3);margin-top:8px}
.bleed{position:absolute;left:0;right:0;bottom:0}
.pool{flex:1;display:flex;flex-direction:column;justify-content:center;border-top:1px solid var(--border)}
.pool:first-of-type{border-top:0}
.trk{height:4px;border-radius:2px;background:var(--track);overflow:hidden;margin-top:10px}.trk i{display:block;height:100%;border-radius:2px}
.sr{display:grid;grid-template-columns:minmax(0,1fr) 220px 56px 40px;gap:16px;align-items:center;flex:1;border-top:1px solid var(--border);font-size:13.5px}
.sr:first-of-type{border-top:0}
.mr{display:grid;grid-template-columns:16px minmax(0,1fr) 34px;gap:10px;align-items:center;flex:1;font-size:13px}
.ix{flex:1;display:flex;gap:12px;align-items:flex-start;padding-top:14px;border-top:1px solid var(--border)}
.ix:first-of-type{border-top:0;padding-top:12px}
.ix .ms{color:var(--fg-3);font-size:17px;margin-top:1px}
.ix .d{font-size:12px;color:var(--fg-4);margin-top:3px}
</style></head><body><div id="app"></div>
<script src="shell.js"></script><script src="kit.js"></script>
<script>
const CW = 290;
const tot = D.hours.map(h => h[0] + h[1]);
const kpi = (label, meta, v, cap, chart) => `<div class="cl"><div class="ch"><span class="l">${label}</span><span class="m">${meta}</span></div><div class="kv num">${v}</div><div class="kc num">${cap}</div><div class="bleed">${chart}</div></div>`;
const bars = (vals, W, H, c) => { const mx = Math.max(...vals), bw = W / vals.length; return `<svg width="${W}" height="${H}" style="display:block">${vals.map((v, i) => `<rect x="${i * bw + 1.5}" y="${H - Math.max(2, v / mx * (H - 4))}" width="${bw - 3}" height="${Math.max(2, v / mx * (H - 4))}" rx="1.5" fill="${v ? c : 'rgb(255 255 255/.06)'}"/>`).join('')}</svg>`; };
const tokensTip = ({ y, bw, L, base }) => { const i = 17, x = L + i * bw + bw / 2, ty = y(1020); return `<line x1="${x}" x2="${x}" y1="0" y2="${base}" stroke="rgb(255 255 255/.18)" stroke-dasharray="2 3"/>
  <foreignObject x="${x - 244}" y="${ty - 6}" width="230" height="96"><div style="background:var(--glass);border:1px solid var(--glass-border);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.65;color:var(--fg-2);box-shadow:0 16px 40px -12px rgb(0 0 0/.6)"><div style="color:var(--fg-3)">今天 05:00–06:00</div><div><i style="display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--s1);margin-right:6px"></i>新增输入 1.00M</div><div><i style="display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--s2);margin-right:6px"></i>输出 20K <span style="color:var(--fg-4)">· 缓存命中 62%</span></div></div></foreignObject>`; };
const SC = [1, .7, .5, .38, .28];
mount(`<div class="gd">
  ${kpi(`${LG('gemini', 13)}5 小时 · Gemini`, '12:00 重置', `$20.8<small>/ $25.8</small>`, `还剩 81% · 1h 00m 后重置`, KIT.area([25.8, 25.8, 25.6, 24.9, 23.4, 22.1, 21.6, 21.2, 20.8], CW, 62, '#3987e5', { lo: 15, hi: 26.5, dot: 1 }))}
  ${kpi(`${LG('claude', 13)}${LG('openai', 13)}5 小时 · Claude / GPT`, '15:58 重置', `100<small>%</small>`, `未使用 · 7 个模型`, KIT.area([1, 1, 1, 1, 1, 1, 1, 1, 1], CW, 62, 'rgb(255 255 255/.4)', { lo: 0, hi: 1.08, fill: false, dash: 1 }))}
  ${kpi('真实消耗', '近 24 小时', `5.16<small>M</small>`, `约 $35.8 · 输入 4.56M · 输出 595K`, bars(tot, CW, 52, '#3987e5'))}
  ${kpi('缓存命中', '近 24 小时', `95.1<small>%</small>`, `复用 89.01M · 近 6 小时 60%`, KIT.area([.97, .97, .96, .97, .95, .95, .9, .92, .9, .8, .62, .58, .6, .61, .6], CW, 62, '#199e70', { lo: .45, hi: 1, dot: 1 }))}

  <div class="cl" style="grid-column:span 3">
    <div class="ch"><h3>Tokens</h3><span class="m"><span class="lgd"><span><i style="background:var(--s1)"></i>新增输入</span><span><i style="background:var(--s2)"></i>输出</span></span><span class="num">411 次调用</span><span class="seg"><span class="on">24h</span><span>7d</span><span>本月</span></span></span></div>
    <div style="margin-top:20px">${KIT.bars(824, 250, { hl: 17, extra: tokensTip })}</div>
  </div>
  <div class="cl">
    <div class="ch"><h3>重置</h3><span class="m">${D.tz}</span></div>
    ${D.pools.map((p, i) => `<div class="pool"><div class="row" style="gap:7px;font-size:12.5px;color:var(--fg-3)">${p.logos.map(l => LG(l, 13)).join('')}${p.name}</div>
      <div class="row" style="justify-content:space-between;align-items:baseline;margin-top:6px"><span class="num" style="font-size:20px;font-weight:450">${p.at}</span><span class="num" style="font-size:12.5px;color:var(--fg-${i ? 4 : 2})">${p.cd}</span></div>
      <div class="trk"><i style="width:${Math.max(p.win, .01) * 100}%;background:${i ? 'rgb(255 255 255/.3)' : 'rgb(255 255 255/.6)'}"></i></div></div>`).join('')}
  </div>

  <div class="cl" style="grid-column:span 2">
    <div class="ch"><h3>会话</h3><span class="m">真实消耗<span class="lk">用量${ic('chevron_right')}</span></span></div>
    <div style="display:flex;flex-direction:column;flex:1;margin-top:6px">
      ${D.sessions.map((s, i) => `<div class="sr"><span class="el" style="color:var(--fg-${i ? 2 : 1})">${s.t}${s.kids ? `<span class="dim2" style="font-size:12px;margin-left:8px">${ic('hub', 13)} ${s.kids}</span>` : ''}</span><span class="trk" style="margin:0"><i style="width:${s.v / 3 * 100}%;background:rgb(57 135 229/${SC[i]})"></i></span><span class="num r">${fmtK(s.v * 1000)}</span><span class="num r dim">${pctS(s.v / D.real)}</span></div>`).join('')}
    </div>
  </div>
  <div class="cl">
    <div class="ch"><h3>模型额度</h3><span class="m"><span class="lk">全部 29 个${ic('chevron_right')}</span></span></div>
    <div style="display:flex;flex-direction:column;flex:1;margin-top:6px">
      ${D.models.map(m => `<div class="mr">${LG(m.l, 15)}<div style="min-width:0"><div class="el">${m.n}</div><div class="trk" style="margin-top:6px"><i style="width:${m.f * 100}%;background:${m.f < 1 ? '#3987e5' : 'rgb(255 255 255/.32)'}"></i></div></div><span class="num r" style="font-size:12.5px;color:var(--fg-${m.f < 1 ? 2 : 4})">${pctS(m.f)}</span></div>`).join('')}
    </div>
  </div>
  <div class="cl">
    <div class="ch"><h3>洞察</h3><span class="m">3 条</span></div>
    <div style="display:flex;flex-direction:column;flex:1;margin-top:4px">
      ${D.ins.map(x => `<div class="ix">${ic(x.i)}<div style="font-size:13px;line-height:1.45">${x.h}<div class="d num">${x.d}</div></div></div>`).join('')}
    </div>
  </div>
</div>`);
</script></body></html>
