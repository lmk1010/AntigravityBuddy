<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>概览探索 J · 月相与河流</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="rows.css">
<style>
.mc{display:flex;flex-direction:column;align-items:center;text-align:center}
.mc .lb{justify-content:center;margin-top:18px}
.mc .big2{margin-top:8px}
.mc .sub2{margin-top:8px}
.mini{display:flex;align-items:center;gap:18px}
.mini .v{font-size:28px;font-weight:350;letter-spacing:-.02em;line-height:1;margin-top:8px;font-variation-settings:"ROND" 20,"wdth" 100}
.mini .v small{font-size:13px;color:var(--fg-4);margin-left:3px}
</style>
</head><body><div id="app"></div>
<script src="shell.js"></script><script src="art.js"></script>
<script>
// 河流图：每条河 = 一个会话，宽度 = 该小时的 tokens，围绕中线对称
function stream(W = 1080, H = 250) {
  const S = D.sessions, n = 24, per = S.map(() => Array(n).fill(0));
  D.calls.forEach(c => per[c.s][Math.min(23, Math.floor(c.t))] += c.tok);
  const tot = S.map((s, i) => per[i].reduce((a, b) => a + b, 0));
  const ser = per.map((r, i) => ART.smooth(r.map(v => v / tot[i] * S[i].v * 1000), .9));
  const X = i => (i + .5) / n * W, mx = Math.max(...Array.from({ length: n }, (_, j) => ser.reduce((a, r) => a + r[j], 0))), k = (H - 40) / mx, mid = (H - 24) / 2;
  const order = [3, 1, 0, 2, 4]; // 大的放中间
  let base = Array.from({ length: n }, (_, j) => mid - ser.reduce((a, r) => a + r[j], 0) * k / 2), s = '';
  order.forEach(si => {
    const top = base.slice(), bot = base.map((b, j) => b + ser[si][j] * k);
    const tp = top.map((y, j) => [X(j), y]), bp = bot.map((y, j) => [X(j), y]).reverse();
    tp.unshift([0, top[0]]); tp.push([W, top.at(-1)]); bp.unshift([W, bot.at(-1)]); bp.push([0, bot[0]]);
    const d = (pts, first) => { let o = (first ? 'M' : 'L') + pts[0][0] + ',' + pts[0][1]; for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], m = (x0 + x1) / 2; o += `C${m},${y0} ${m},${y1} ${x1},${y1}`; } return o; };
    s += `<path d="${d(tp, 1)}${d(bp, 0)}Z" fill="${ART.pal[si]}" opacity=".88"/>`;
    // 在最宽处写名字
    const j = ser[si].indexOf(Math.max(...ser[si])), th = ser[si][j] * k;
    if (th > 24) s += `<text x="${Math.min(X(j), W - 56)}" y="${base[j] + th / 2 + 4}" text-anchor="middle" style="fill:#0b0b0e;font-size:12px;font-weight:550">${['Casual Greeting', 'Server Deployment', 'Neox UI', 'Future Trends', '国考申论'][si]}</text>`;
    base = bot;
  });
  [[0, '昨天 12:00'], [6, '18:00'], [12, '00:00'], [18, '06:00'], [24, '现在']].forEach(([i, l]) => s += `<text x="${i / 24 * W}" y="${H - 4}" text-anchor="${i === 24 ? 'end' : i ? 'middle' : 'start'}">${l}</text>`);
  return `<svg width="${W}" height="${H}" style="display:block;overflow:visible;font-size:11.5px;fill:var(--fg-4)"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="rgb(255 255 255/.06)"/>${s}</svg>`;
}
const ring = (f, size, c) => { const r = size / 2 - 4, C = 2 * Math.PI * r; return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg);display:block"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgb(255 255 255/.08)" stroke-width="5"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C * f} ${C}"/></svg>`; };
const dotsGrid = (n, cols, c) => `<svg width="${cols * 6}" height="${Math.ceil(n / cols) * 6}" style="display:block">${Array.from({ length: n }, (_, i) => `<circle cx="${(i % cols) * 6 + 2.5}" cy="${Math.floor(i / cols) * 6 + 2.5}" r="2" fill="${c}" opacity="${(.35 + .65 * i / n).toFixed(2)}"/>`).join('')}</svg>`;
const split = (a, b, c1, c2) => `<svg width="56" height="56" style="display:block">${Array.from({ length: 7 }, (_, r) => Array.from({ length: 7 }, (_, c) => { const i = r * 7 + c, on = i < Math.round(a / (a + b) * 49); return `<rect x="${c * 8}" y="${r * 8}" width="6" height="6" rx="1.5" fill="${on ? c1 : c2}"/>`; }).join('')).join('')}</svg>`;
const MC = ['#8FBBFF', '#F6C27A', '#B4A8FF'];
mount(`<div class="pg">
  <section class="rw" style="height:236px">
    ${D.pools.map((p, i) => `<div class="md mc" style="grid-column:span 4">${ART.moon(p.left, 112, MC[i])}<div class="lb">${p.logos.map(l => LG(l, 13)).join('')}${p.name}</div><div class="big2 num">${Math.round(p.left * 100)}<small>%</small></div><div class="sub2 num">${p.at} 重置 · ${p.cd}</div></div>`).join('')}
  </section>
  <section class="rw" style="height:290px">
    <div class="md" style="grid-column:1/-1">
      <div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="lb">近 24 小时 · Tokens 按会话汇流</div><div class="big2 num" style="font-size:44px">5.16<small>M</small></div></div><div class="lb" style="color:var(--fg-4)">约 $35.8</div></div>
      <div style="margin-top:10px">${stream()}</div>
    </div>
  </section>
  <section class="rw" style="height:90px">
    <div class="md mini" style="grid-column:span 3">${dotsGrid(70, 10, '#9D8CFF')}<div><div class="lb">调用</div><div class="v num">411<small>次</small></div></div></div>
    <div class="md mini" style="grid-column:span 3">${split(4.56, .595, '#5B9BFF', '#F2B35B')}<div><div class="lb">输入 / 输出</div><div class="v num">4.56<small>M</small> <span style="font-size:15px;color:var(--fg-3)">/ 595K</span></div></div></div>
    <div class="md mini" style="grid-column:span 3">${ring(.951, 56, '#4FC3D9')}<div><div class="lb">缓存命中</div><div class="v num">95.1<small>%</small></div></div></div>
    <div class="md mini" style="grid-column:span 3"><svg width="56" height="56" style="display:block">${D.sessions.map((x, i) => { const r = 4 + Math.sqrt(x.v) * 9; return `<circle cx="${[22, 44, 42, 12, 30][i]}" cy="${[24, 14, 40, 44, 48][i]}" r="${Math.min(r, 20)}" fill="${ART.pal[i]}" opacity=".9"/>`; }).join('')}</svg><div><div class="lb">活跃会话</div><div class="v num">5<small>个 · 含 4 个子代理</small></div></div></div>
  </section>
</div>`);
</script></body></html>
