<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>概览探索 F · 不对称网格</title>
<link rel="stylesheet" href="base.css">
<style>
.body{padding:0}
.gd{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:234px 234px 1fr;gap:1px;background:var(--border);height:100%}
.cl{background:var(--background);padding:20px 24px;position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;height:20px;font-size:13px;color:var(--fg-3);flex:none}
.ch h3{color:var(--fg);font-size:14px}.ch .l{display:flex;align-items:center;gap:7px}
.ch .m{font-size:12px;color:var(--fg-4);display:flex;align-items:center;gap:10px}
.hv{font-size:52px;font-weight:400;letter-spacing:-.03em;line-height:1;font-variation-settings:"ROND" 20,"wdth" 100}
.hv small{font-size:16px;color:var(--fg-4);margin-left:6px;letter-spacing:0;font-weight:350}
.kv{font-size:34px;font-weight:450;letter-spacing:-.02em;line-height:1;font-variation-settings:"ROND" 20,"wdth" 100}
.kv small{font-size:14px;color:var(--fg-4);font-weight:350;margin-left:3px;letter-spacing:0}
.stx{display:flex;gap:28px;margin-top:16px;font-size:12.5px;color:var(--fg-3)}
.stx b{display:block;color:var(--fg);font-size:15px;font-weight:450;margin-top:2px}
.stx i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px}
.ft{margin-top:auto;display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg-3)}
.trk{height:4px;border-radius:2px;background:var(--track);overflow:hidden}.trk i{display:block;height:100%;border-radius:2px}
.ix{flex:1;display:flex;gap:12px;align-items:flex-start;padding-top:14px;border-top:1px solid var(--border)}
.ix:first-of-type{border-top:0;padding-top:10px}
.ix .ms{color:var(--fg-3);font-size:17px;margin-top:1px}
.ix .d{font-size:12px;color:var(--fg-4);margin-top:3px}
.tm{position:absolute;border-radius:6px;padding:10px 12px;overflow:hidden;font-size:12.5px;line-height:1.4}
</style></head><body><div id="app"></div>
<script src="shell.js"></script><script src="kit.js"></script>
<script>
// 主图：输入 + 输出叠成平滑面积，贴边
function hero(W, H) {
  const hs = D.hours, mx = 1250, n = hs.length, X = i => i / (n - 1) * W, Y = v => H - 26 - v / mx * (H - 40);
  const a = hs.map((h, i) => [X(i), Y(h[0])]), b = hs.map((h, i) => [X(i), Y(h[0] + h[1])]);
  const da = KIT.path(a, 1), db = KIT.path(b, 1);
  const rev = KIT.path(a.slice().reverse(), 1).replace(/^M/, 'L');
  let grid = '';
  [0, 6, 12, 18, 23].forEach(i => grid += `<text x="${i === 0 ? 24 : i === 23 ? W - 24 : X(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === 23 ? 'end' : 'middle'}">${i === 23 ? '现在' : D.hourLabel(i) + ':00'}</text>`);
  const pk = 17;
  return `<svg width="${W}" height="${H}" style="display:block;font-size:11.5px;fill:var(--fg-4)"><defs>
    <linearGradient id="ha" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3987e5" stop-opacity=".45"/><stop offset="1" stop-color="#3987e5" stop-opacity=".02"/></linearGradient></defs>
    <path d="${db}${rev}Z" fill="#d95926" fill-opacity=".55"/>
    <path d="${da}L${W},${H - 26}L0,${H - 26}Z" fill="url(#ha)"/>
    <path d="${da}" fill="none" stroke="#3987e5" stroke-width="1.6"/>
    <line x1="0" x2="${W}" y1="${H - 26}" y2="${H - 26}" stroke="rgb(255 255 255/.1)"/>
    <line x1="${X(pk)}" x2="${X(pk)}" y1="${Y(1020) - 6}" y2="${H - 26}" stroke="rgb(255 255 255/.25)" stroke-dasharray="2 3"/>
    <circle cx="${X(pk)}" cy="${Y(1000)}" r="4" fill="#3987e5" stroke="var(--background)" stroke-width="2"/>
    <text x="${X(pk) - 10}" y="${Y(1020) - 4}" text-anchor="end" style="fill:var(--fg-2);font-size:12px">05:00 · 1.00M 新增输入，没命中缓存</text>
    ${grid}</svg>`;
}
const P = D.pools;
const small = (p, i) => `<div class="cl"><div class="ch"><span class="l">${p.logos.map(l => LG(l, 13)).join('')}${p.name}</span><span class="m">${p.models} 个模型</span></div>
  <div class="row" style="align-items:baseline;gap:10px;margin-top:18px"><span class="kv num">100<small>%</small></span><span class="dim" style="font-size:12.5px">未使用</span></div>
  <div style="margin-top:16px">${KIT.dots(1, 20, 4, 9, 3.2, 'rgb(255 255 255/.45)')}</div>
  <div class="ft"><span class="num">${p.at} 重置</span><span class="num dim2">${p.cd}</span></div></div>`;
const TM = KIT.treemap(D.sessions.map((s, i) => ({ ...s, i })), 532, 262, 3);
const OP = [.92, .62, .46, .36, .28];
mount(`<div class="gd">
  <div class="cl" style="grid-row:span 2;padding:20px 0 0">
    <div style="padding:0 24px">
      <div class="ch"><span class="l">真实消耗 · 近 24 小时</span><span class="m"><span class="seg"><span class="on">24h</span><span>7d</span><span>本月</span></span></span></div>
      <div class="row" style="align-items:baseline;gap:14px;margin-top:14px"><span class="hv num">5.16<small>M tokens</small></span><span class="num" style="color:var(--fg-2);font-size:15px">约 $35.8</span></div>
      <div class="stx num"><span><i style="background:var(--s1)"></i>新增输入<b>4.56M</b></span><span><i style="background:var(--s2)"></i>输出<b>595K</b></span><span><i style="background:rgb(255 255 255/.3)"></i>缓存复用<b>89.01M</b></span><span>调用<b>411 次</b></span></div>
    </div>
    <div style="margin-top:auto">${hero(580, 300)}</div>
  </div>
  <div class="cl" style="grid-row:span 2">
    <div class="ch"><span class="l">${LG('gemini', 13)}5 小时 · Gemini</span><span class="m">4 个模型</span></div>
    <div class="row" style="align-items:baseline;gap:10px;margin-top:18px"><span class="kv num" style="font-size:44px">81<small>%</small></span></div>
    <div class="num" style="color:var(--fg-2);margin-top:8px">还剩 $20.8 <span class="dim2">/ $25.8</span></div>
    <div style="margin-top:22px">${KIT.dots(.81, 10, 9, 18, 6, '#3987e5')}</div>
    <div class="dim" style="font-size:12px;margin-top:12px">每格约 $0.29 · 已花 $4.94</div>
    <div class="ft"><span class="num" style="color:var(--fg)">12:00 重置</span><span class="num">1h 00m</span></div>
  </div>
  ${small(P[1], 1)}
  ${small(P[2], 2)}

  <div class="cl">
    <div class="ch"><h3>会话</h3><span class="m">面积 = 真实消耗<span class="lk">用量${ic('chevron_right')}</span></span></div>
    <div style="position:relative;width:532px;height:262px;margin-top:14px">
      ${TM.map(t => `<div class="tm" style="left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px;background:rgb(57 135 229/${OP[t.i]});color:${t.i < 2 ? '#fff' : 'rgb(255 255 255/.85)'}"><div class="el">${t.t}</div><div class="num" style="opacity:.7;margin-top:2px">${fmtK(t.v * 1000)}${t.w > 150 ? ' · ' + pctS(t.v / D.real) : ''}</div>${t.kids ? `<span class="ms" style="position:absolute;right:8px;bottom:8px;font-size:14px;opacity:.7">hub</span>` : ''}</div>`).join('')}
    </div>
  </div>
  <div class="cl">
    <div class="ch"><h3>缓存命中</h3><span class="m">每格 1%</span></div>
    <div class="row" style="align-items:baseline;gap:8px;margin-top:14px"><span class="kv num">95.1<small>%</small></span></div>
    <div class="dim" style="font-size:12px;margin:6px 0 12px">复用 89.01M · 新增只占 4.9%</div>
    <div style="display:flex;gap:18px;align-items:flex-end">${KIT.waffle(.951, 10, 14, 3.5, '#199e70')}<div style="font-size:12px;color:var(--fg-3);line-height:1.5">${ic('trending_down', 16)}<div style="font-size:20px;color:var(--fg);font-weight:450;margin-top:6px" class="num">60%</div>近 6 小时</div></div>
  </div>
  <div class="cl">
    <div class="ch"><h3>洞察</h3><span class="m">由近 24 小时算出</span></div>
    <div style="display:flex;flex-direction:column;flex:1;margin-top:6px">
      ${D.ins.map(x => `<div class="ix">${ic(x.i)}<div style="font-size:13px;line-height:1.45">${x.h}<div class="d num">${x.d}</div></div></div>`).join('')}
    </div>
  </div>
</div>`);
</script></body></html>
