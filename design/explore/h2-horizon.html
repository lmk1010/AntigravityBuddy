<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>概览探索 H2 · 地平线（深 / 浅）</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="rows.css"><link rel="stylesheet" href="light.css">
<style>
.qh{display:flex;align-items:center;gap:12px}
.qh .n{font-size:14px;color:var(--fg)}.qh .t{font-size:12.5px;color:var(--fg-3);margin-top:2px}
.qh .p{margin-left:auto;font-size:34px;font-weight:350;letter-spacing:-.03em;line-height:1;font-variation-settings:"ROND" 20,"wdth" 100}
.qh .p small{font-size:14px;color:var(--fg-4);margin-left:2px;letter-spacing:0}
.qf{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-4);margin-top:10px}
.qf b{color:var(--fg-2);font-weight:400}
.hd{display:flex;justify-content:space-between;align-items:flex-start;height:28px}
.hd .v{font-size:28px;font-weight:350;letter-spacing:-.02em;line-height:1;font-variation-settings:"ROND" 20,"wdth" 100}
.hd .v small{font-size:13px;color:var(--fg-4);margin-left:2px}
.aura{position:absolute;inset:-36px -41px auto;height:420px;pointer-events:none;overflow:hidden}
.aura i{position:absolute;border-radius:50%;filter:blur(70px)}
</style></head><body><div id="app"></div>
<script src="shell.js"></script><script src="kit.js"></script><script src="art.js"></script><script src="ui.js"></script>
<script>
const LIGHT = location.search.includes('light');
if (LIGHT) document.body.classList.add('light');
const ink = a => `rgb(var(--ink) / ${a})`;

// —— 第一行：山脊 + 太阳弧（同 H，配色随主题）
function landscape(W = 1080, H = 330) {
  const G = 292, X = i => i / 24 * W, mx = 1100, sc = 200;
  const inp = ART.smooth(D.hours.map(h => h[0]), 1.1), out = ART.smooth(D.hours.map(h => h[1] * 2.2), 1), far = ART.smooth(D.hours.map(h => h[0] + h[1]), 2.6);
  const ridge = (vals, k) => { const pts = vals.map((v, i) => [X(i + .5), G - v / mx * sc * k]); pts.unshift([0, G - vals[0] / mx * sc * k]); pts.push([W, G - vals.at(-1) / mx * sc * k]); let d = `M0,${G}L${pts[0][0]},${pts[0][1]}`; for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], m = (x0 + x1) / 2; d += `C${m},${y0} ${m},${y1} ${x1},${y1}`; } return d + `L${W},${G}Z`; };
  const a0 = X(19), a1 = X(24), ar = (a1 - a0) / 2, acx = a0 + ar, th = Math.PI * .2, sx = acx + ar * Math.cos(th), sy = G - 40 - ar * .9 * Math.sin(th);
  let stars = ''; if (!LIGHT) for (let i = 0; i < 46; i++) { const x = D.rnd() * W * .78 + 20, y = D.rnd() * 150 + 8, r = D.rnd() * 1 + .4; stars += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${(D.rnd() * .35 + .08).toFixed(2)}"/>`; }
  const pk = 8, px = X(pk + .5), py = G - inp[pk] / mx * sc - 4;
  const t = [[0, '昨天 12:00'], [6, '18:00'], [12, '00:00'], [18, '06:00'], [24, '现在']].map(([i, l]) => `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 24 ? 'end' : i ? 'middle' : 'start'}">${l}</text>`).join('');
  const C = LIGHT ? { f0: '#7FB0FF', f1: .22, m0: '#5B9BFF', m1: '#D6E6FF', o0: '#F7B267', o1: '#FFE9CF' } : { f0: '#5B9BFF', f1: .16, m0: '#5B9BFF', m1: '#2F5FB8', o0: '#F2B35B', o1: '#D95926' };
  return `<svg width="${W}" height="${H}" style="display:block;overflow:visible;font-size:11.5px;fill:var(--fg-4)"><defs>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.f0}" stop-opacity="${C.f1}"/><stop offset="1" stop-color="${C.f0}" stop-opacity=".02"/></linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.m0}" stop-opacity=".92"/><stop offset="1" stop-color="${C.m1}" stop-opacity="${LIGHT ? .5 : .25}"/></linearGradient>
    <linearGradient id="fr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.o0}" stop-opacity=".95"/><stop offset="1" stop-color="${C.o1}" stop-opacity="${LIGHT ? .6 : .35}"/></linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFE6B0"/><stop offset=".35" stop-color="#F2B35B" stop-opacity=".9"/><stop offset="1" stop-color="#F2B35B" stop-opacity="0"/></radialGradient></defs>
    ${stars}
    <path d="M${a0},${G - 40} A${ar},${ar * .9} 0 0 1 ${a1},${G - 40}" fill="none" style="stroke:${ink(.25)}" stroke-dasharray="1 5" stroke-linecap="round" stroke-width="1.6"/>
    <circle cx="${sx}" cy="${sy}" r="34" fill="url(#sun)"/><circle cx="${sx}" cy="${sy}" r="7" fill="${LIGHT ? '#F7A93B' : '#FFF1D2'}"/>
    <text x="${a1 - 4}" y="${G - 22}" text-anchor="end" style="fill:var(--fg-2);font-size:12px">12:00 重置</text>
    <text x="${a0 + 4}" y="${G - 22}" style="fill:var(--fg-4);font-size:12px">07:00</text>
    <path d="${ridge(far, 1.25)}" fill="url(#far)"/><path d="${ridge(inp, 1)}" fill="url(#mid)"/><path d="${ridge(out, 1)}" fill="url(#fr)"/>
    <line x1="${px}" x2="${px}" y1="${py - 46}" y2="${py}" style="stroke:${ink(.35)}"/>
    <foreignObject x="${px - 7}" y="${py - 68}" width="200" height="24"><div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);white-space:nowrap">${LG('gemini', 14)}峰值 1.02M · 20:00</div></foreignObject>
    <line x1="0" x2="${W}" y1="${G}" y2="${G}" style="stroke:${ink(.16)}"/>
    ${D.hours.map((h, i) => `<rect class="hb" data-h="${i}" x="${X(i)}" y="0" width="${W / 24}" height="${G}" fill="transparent" data-tip='<b>${D.hourLabel(i)}:00–${D.hourLabel(i + 1)}:00</b><br><i class="k" style="background:#5B9BFF"></i>新增输入 ${fmtK(h[0])}<br><i class="k" style="background:#F2B35B"></i>输出 ${fmtK(h[1])}${h[2] ? `<br><span style="color:var(--fg-4)">缓存命中 ${Math.round(h[2] * 100)}% · 点击查看明细</span>` : ''}'/>`).join('')}
    <line id="hx" x1="0" x2="0" y1="0" y2="${G}" style="stroke:${ink(.35)};display:none" stroke-dasharray="2 3"/>
    ${t}</svg>`;
}
// —— 第二行：额度胶囊。渐变 = 剩余，竖纹 = 每 5% 一格，下方小三角 = 窗口时间走到哪
function capsule(f, win, g, W = 344, H = 26) {
  const id = 'cp' + Math.random().toString(36).slice(2, 7), fw = Math.max(H, W * f);
  let ticks = ''; for (let i = 1; i < 20; i++) { const x = i * W / 20; if (x < fw - 6) ticks += `<line x1="${x}" x2="${x}" y1="6" y2="${H - 6}" stroke="#fff" stroke-opacity=".28"/>`; }
  const wx = Math.max(4, W * win);
  return `<svg width="${W}" height="${H + 12}" style="display:block;overflow:visible"><defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="${g[0]}"/><stop offset=".55" stop-color="${g[1]}"/><stop offset="1" stop-color="${g[2]}"/></linearGradient>
    <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <rect width="${W}" height="${H}" rx="${H / 2}" style="fill:${ink(.06)}"/>
    <rect width="${fw}" height="${H}" rx="${H / 2}" fill="url(#${id})"/>
    <rect x="2" y="2" width="${fw - 4}" height="${H / 2 - 2}" rx="${H / 2 - 2}" fill="url(#${id}s)"/>
    ${ticks}
    <path d="M${wx},${H + 4} l4,6 h-8z" style="fill:var(--fg-3)"/></svg>`;
}
// —— 第三行左：会话光谱带
function spectrum(W = 712, H = 46) {
  const S = D.sessions, g = 3; let x = 0, s = '', lab = '';
  S.forEach((se, i) => {
    const w = (W - g * (S.length - 1)) * se.v / D.real, id = 'sp' + i;
    s += `<defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="${ART.pal[i]}"/><stop offset="1" stop-color="${ART.pal[(i + 1) % 5]}" stop-opacity=".85"/></linearGradient></defs><rect x="${x}" width="${w}" height="${H}" rx="${i === 0 ? 12 : 4}" fill="url(#${id})" data-tip='<b>${se.t}</b><br>${fmtK(se.v * 1000)} · ${pctS(se.v / D.real)} · ${se.n} 次调用${se.kids ? ` · ${se.kids} 个子代理` : ''}<br><span style="color:var(--fg-4)">点击筛选用量和明细</span>'/>`;
    if (i === 0) s += `<rect x="${x + 12}" width="${w - 12}" height="${H}" fill="url(#${id})"/>`;
    if (i === S.length - 1) s += `<rect x="${x}" width="${w}" height="${H}" rx="12" fill="url(#${id})"/>`;
    if (w > 100) lab += `<div style="position:absolute;left:${x}px;top:${H + 12}px;width:${w}px"><div class="el" style="font-size:13px;color:var(--fg)">${se.t}</div><div class="num" style="font-size:12px;color:var(--fg-4);margin-top:2px">${fmtK(se.v * 1000)} · ${pctS(se.v / D.real)}</div></div>`;
    x += w + g;
  });
  const smalls = S.slice(2);
  lab += `<div style="position:absolute;left:${x - g - smalls.reduce((a, b) => a + (W - g * 4) * b.v / D.real + g, 0) + g}px;right:0;top:${H + 12}px;display:flex;flex-direction:column;gap:3px;align-items:flex-end">${smalls.map((se, k) => `<div class="row num" style="gap:7px;font-size:12px;color:var(--fg-3)"><i style="width:7px;height:7px;border-radius:2px;background:${ART.pal[k + 2]}"></i>${['Neox UI', 'Future Trends', '国考申论'][k]}<span style="color:var(--fg-4)">${fmtK(se.v * 1000)}</span></div>`).join('')}</div>`;
  return `<div style="position:relative;height:${H + 76}px"><svg width="${W}" height="${H}" style="display:block">${s}</svg>${lab}</div>`;
}
// —— 第三行右：缓存命中曲线，末端标数值（参照 T3 的端点标注）
function cacheLine(W = 290, H = 104) {
  const v = [.97, .97, .96, .97, .95, .95, .96, .95, .9, .92, .9, .8, .62, .58, .6, .61, .6], lo = .5, hi = 1;
  const X = i => i / (v.length - 1) * W, Y = x => 6 + (1 - (x - lo) / (hi - lo)) * (H - 12);
  const pts = v.map((x, i) => [X(i), Y(x)]); let d = `M${pts[0][0]},${pts[0][1]}`; for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], m = (x0 + x1) / 2; d += `C${m},${y0} ${m},${y1} ${x1},${y1}`; }
  const e = pts.at(-1);
  return `<svg width="${W + 54}" height="${H}" style="display:block;overflow:visible;font-size:11.5px"><defs><linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FC3D9" stop-opacity=".28"/><stop offset="1" stop-color="#4FC3D9" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${Y(.95)}" y2="${Y(.95)}" style="stroke:${ink(.22)}" stroke-dasharray="2 4"/><text x="${W + 12}" y="${Y(.95) + 4}" style="fill:var(--fg-4)">均 95%</text>
    <path d="${d}L${W},${H}L0,${H}Z" fill="url(#cl)"/><path d="${d}" fill="none" stroke="#4FC3D9" stroke-width="2"/>
    <circle cx="${e[0]}" cy="${e[1]}" r="4.5" fill="#4FC3D9" style="stroke:var(--background)" stroke-width="2.5"/>
    <text x="${e[0] + 12}" y="${e[1] + 5}" style="fill:var(--fg);font-size:15px;font-weight:450">60%</text>
    <text x="${e[0] + 12}" y="${e[1] + 22}" style="fill:var(--fg-4)">近 6h</text></svg>`;
}
const G3 = [['#4C8DF6', '#8E7CF6', '#C76BD9'], ['#D97757', '#E8955E', '#F2B35B'], ['#4C8DF6', '#4FB6E6', '#4FC3D9']];
const tileOf = p => UI.tile(p.logos);
const foot = [`<span>已用 <b>$4.94</b> · 剩 <b>$20.8</b></span><span>共约 $25.8</span>`, `<span>未使用 · 剩 <b>约 $31.0</b></span><span>共约 $31.0</span>`, `<span>未使用 · 剩 <b>约 $126</b></span><span>共约 $126</span>`];
const TIPQ = [`<b>5 小时 · Gemini</b><br>已用 $4.94 · 剩 $20.8 · 共约 $25.8<br>窗口 07:00 → 12:00，已过 80%<br><span style="color:var(--fg-4)">总额按本窗口已用金额与比例推算</span>`, `<b>5 小时 · Claude / GPT</b><br>未使用 · 共约 $31.0<br><span style="color:var(--fg-4)">按上一个窗口的用量推算</span>`, `<b>每周 · Gemini</b><br>未使用 · 共约 $126<br>周五 10:58 重置`];
mount(`<div class="pg" style="position:relative;gap:48px">
  <div class="aura">${LIGHT ? '<i style="left:-120px;top:-160px;width:520px;height:360px;background:#CFE2FF;opacity:.7"></i><i style="right:-80px;top:-120px;width:420px;height:300px;background:#FFE2C4;opacity:.7"></i>' : '<i style="left:-140px;top:-200px;width:560px;height:360px;background:#2F5FB8;opacity:.16"></i><i style="right:-120px;top:-180px;width:460px;height:320px;background:#F2B35B;opacity:.08"></i>'}</div>
  <section class="rw" style="height:330px;position:relative">
    <div style="grid-column:1/-1;position:relative">${landscape()}
      <div style="position:absolute;left:0;top:0"><div class="lb">近 24 小时 · Tokens</div><div class="hero num">5.16<small>M</small></div><div class="sub2 num">约 $35.8 · 输入 4.56M · 输出 595K</div></div>
    </div>
  </section>
  <section class="rw" style="height:118px">
    ${D.pools.map((p, i) => `<div class="md" style="grid-column:span 4"><div class="qh">${tileOf(p)}<div><div class="n">${p.name}</div><div class="t num">${p.at} 重置 · ${p.cd}</div></div><span class="p num">${Math.round(p.left * 100)}<small>%</small></span></div>
      <div style="margin-top:20px" class="cap-q" data-tip='${TIPQ[i]}'>${capsule(p.left, p.win, G3[i])}</div><div class="qf num">${foot[i]}</div></div>`).join('')}
  </section>
  <section class="rw" style="height:150px">
    <div class="md" style="grid-column:span 8"><div class="hd"><span class="lb">会话 · 按真实消耗</span><span class="lb" style="color:var(--fg-4)">5 个会话 · 含 4 个子代理</span></div><div style="margin-top:16px">${spectrum()}</div></div>
    <div class="md" style="grid-column:span 4"><div class="hd"><span class="lb">缓存命中 · 24h</span><span class="v num">95.1<small>%</small></span></div><div style="margin-top:16px">${cacheLine()}</div></div>
  </section>
</div>`);
// 交互：小时竖线跟随；出图时固定展示 20:00 的提示
document.querySelectorAll('.hb').forEach(r => r.addEventListener('mouseenter', () => { const l = document.getElementById('hx'), x = +r.getAttribute('x') + r.getAttribute('width') / 2; l.setAttribute('x1', x); l.setAttribute('x2', x); l.style.display = ''; }));
if (!UI.q.has('clean')) { const r = document.querySelector('.hb[data-h="8"]'); r.dispatchEvent(new Event('mouseenter')); UI.pin('.hb[data-h="8"]', r.dataset.tip, .5, .62); }
</script></body></html>
