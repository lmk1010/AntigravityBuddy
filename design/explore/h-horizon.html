<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>概览探索 H · 地平线</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="rows.css">
</head><body><div id="app"></div>
<script src="shell.js"></script><script src="art.js"></script>
<script>
// 主视觉：Tokens 画成连绵的山，Gemini 5 小时窗口是一道太阳弧，太阳在“现在”
function landscape(W = 1080, H = 330) {
  const G = 292, X = i => i / 24 * W, mx = 1100, sc = 200;
  const inp = ART.smooth(D.hours.map(h => h[0]), 1.1), out = ART.smooth(D.hours.map(h => h[1] * 2.2), 1), far = ART.smooth(D.hours.map(h => h[0] + h[1]), 2.6);
  const ridge = (vals, k) => { const pts = vals.map((v, i) => [X(i + .5), G - v / mx * sc * k]); pts.unshift([0, G - vals[0] / mx * sc * k]); pts.push([W, G - vals.at(-1) / mx * sc * k]); let d = `M0,${G}L${pts[0][0]},${pts[0][1]}`; for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], m = (x0 + x1) / 2; d += `C${m},${y0} ${m},${y1} ${x1},${y1}`; } return d + `L${W},${G}Z`; };
  // 太阳弧：07:00 → 12:00
  const a0 = X(19), a1 = X(24), ar = (a1 - a0) / 2, acx = a0 + ar, f = .8, th = Math.PI * (1 - f), sx = acx + ar * Math.cos(th), sy = G - 40 - ar * .9 * Math.sin(th);
  let stars = ''; for (let i = 0; i < 46; i++) { const x = D.rnd() * W * .78 + 20, y = D.rnd() * 150 + 8, r = D.rnd() * 1 + .4; stars += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${(D.rnd() * .35 + .08).toFixed(2)}"/>`; }
  const t = [[0, '昨天 12:00'], [6, '18:00'], [12, '00:00'], [18, '06:00'], [23, '现在']].map(([i, l]) => `<text x="${i === 0 ? 0 : X(i + .5)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : 'middle'}">${l}</text>`).join('');
  return `<svg width="${W}" height="${H}" style="display:block;overflow:visible;font-size:11.5px;fill:var(--fg-4)"><defs>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B9BFF" stop-opacity=".16"/><stop offset="1" stop-color="#5B9BFF" stop-opacity=".02"/></linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B9BFF" stop-opacity=".9"/><stop offset="1" stop-color="#2F5FB8" stop-opacity=".25"/></linearGradient>
    <linearGradient id="fr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2B35B" stop-opacity=".95"/><stop offset="1" stop-color="#D95926" stop-opacity=".35"/></linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFE6B0"/><stop offset=".35" stop-color="#F2B35B" stop-opacity=".9"/><stop offset="1" stop-color="#F2B35B" stop-opacity="0"/></radialGradient></defs>
    ${stars}
    <path d="M${a0},${G - 40} A${ar},${ar * .9} 0 0 1 ${a1},${G - 40}" fill="none" stroke="rgb(255 255 255/.22)" stroke-dasharray="1 5" stroke-linecap="round" stroke-width="1.6"/>
    <circle cx="${sx}" cy="${sy}" r="34" fill="url(#sun)"/><circle cx="${sx}" cy="${sy}" r="7" fill="#FFF1D2"/>
    <text x="${a1 - 4}" y="${G - 22}" text-anchor="end" style="fill:var(--fg-2);font-size:12px">12:00 重置</text>
    <text x="${a0 + 4}" y="${G - 22}" text-anchor="start" style="fill:var(--fg-4);font-size:12px">07:00</text>
    <path d="${ridge(far, 1.25)}" fill="url(#far)"/>
    <path d="${ridge(inp, 1)}" fill="url(#mid)"/>
    <path d="${ridge(out, 1)}" fill="url(#fr)"/>
    <line x1="0" x2="${W}" y1="${G}" y2="${G}" stroke="rgb(255 255 255/.16)"/>
    ${t}</svg>`;
}
function pebbles(W = 712, H = 140) {
  const S = D.sessions, k = 52 / Math.sqrt(S[0].v), G = H - 42; let x = 0, s = '';
  S.forEach((se, i) => { const r = k * Math.sqrt(se.v), cx = x + r; s += `<circle cx="${cx}" cy="${G - r}" r="${r}" fill="${ART.pal[i]}" opacity="${i ? .85 : 1}"/><text x="${cx}" y="${G + 20}" text-anchor="middle" style="fill:var(--fg-${i ? 3 : 2});font-size:12px">${['Casual', 'Server', 'Neox UI', 'Future', '国考'][i]}</text><text x="${cx}" y="${G + 36}" text-anchor="middle" style="fill:var(--fg-4);font-size:11.5px">${fmtK(se.v * 1000)}</text>`; x = cx + r + 34; });
  return `<svg width="${W}" height="${H}" style="display:block;overflow:visible">${s}</svg>`;
}
function tickRing(f, size = 120) {
  const c = size / 2, r1 = c - 14, r2 = c - 2; let s = '';
  for (let i = 0; i < 100; i++) { const a = i / 100 * 2 * Math.PI - Math.PI / 2, on = i < Math.round(f * 100); s += `<line x1="${c + r1 * Math.cos(a)}" y1="${c + r1 * Math.sin(a)}" x2="${c + r2 * Math.cos(a)}" y2="${c + r2 * Math.sin(a)}" stroke="${on ? '#4FC3D9' : 'rgb(255 255 255/.14)'}" stroke-width="1.6" stroke-linecap="round" opacity="${on ? (.35 + .65 * i / 100).toFixed(2) : 1}"/>`; }
  return `<svg width="${size}" height="${size}" style="display:block">${s}</svg>`;
}
const orbs = [[.81, '#7DB3FF', '#2F5FB8'], [1, '#F6C27A', '#C8642E'], [1, '#B4A8FF', '#5B4BC4']];
mount(`<div class="pg">
  <section class="rw" style="height:330px;position:relative">
    <div style="grid-column:1/-1;position:relative">${landscape()}
      <div style="position:absolute;left:0;top:0"><div class="lb">近 24 小时 · Tokens</div><div class="hero num">5.16<small>M</small></div><div class="sub2 num">约 $35.8 · 缓存命中 95.1%</div></div>
    </div>
  </section>
  <section class="rw" style="height:160px">
    ${D.pools.map((p, i) => `<div class="md" style="grid-column:span 4;display:flex;gap:24px;align-items:center">${ART.orb(p.left, 140, orbs[i][0], orbs[i][1])}<div><div class="lb">${p.logos.map(l => LG(l, 13)).join('')}${p.name}</div><div class="big2 num">${Math.round(p.left * 100)}<small>%</small></div><div class="sub2 num">${p.at} 重置 · ${p.cd}</div></div></div>`).join('')}
  </section>
  <section class="rw" style="height:170px">
    <div class="md" style="grid-column:span 8"><div class="lb">会话 · 大小 = 真实消耗</div><div style="margin-top:14px">${pebbles()}</div></div>
    <div class="md" style="grid-column:span 4;display:flex;gap:24px;align-items:center">${tickRing(.951, 140)}<div><div class="lb">缓存命中</div><div class="big2 num">95.1<small>%</small></div><div class="sub2 num">复用 89.01M tokens</div></div></div>
  </section>
</div>`);
</script></body></html>
