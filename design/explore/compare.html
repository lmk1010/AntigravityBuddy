<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>概览探索 · 对比</title>
<link rel="stylesheet" href="base.css">
<style>
body{background:#000;padding:36px 40px}
h1{font-size:20px;font-weight:450;margin-bottom:4px}
.s{color:var(--fg-3);font-size:13px;margin-bottom:24px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:28px 32px}
.g img{width:100%;display:block;border-radius:10px;box-shadow:0 0 0 1px rgb(255 255 255/.1)}
.t{display:flex;gap:10px;align-items:baseline;margin-top:12px}
.t b{font-weight:550}.t span{color:var(--fg-3);font-size:13px}
</style></head><body>
<h1>Buddy 概览 · 第三轮 · 只按横行排、放大可视化</h1>
<div class="s">同一份数据（11-20 11:00），只换布局与图形表达</div>
<div class="g">
  <div><img src="png/h-horizon.png"><div class="t"><b>H · 地平线</b><span>Tokens 画成山脊，Gemini 窗口是太阳弧；额度是液体球，会话是鹅卵石</span></div></div>
  <div><img src="png/i-rhythm.png"><div class="t"><b>I · 节律</b><span>411 次调用每次一个点；顶部 4 个大数字；重置用钟面和周环</span></div></div>
  <div><img src="png/j-moon.png"><div class="t"><b>J · 月相与河流</b><span>额度是月相；Tokens 按会话汇成河流图；底部 4 个小图形</span></div></div>
  <div></div>
</div>
</body></html>
