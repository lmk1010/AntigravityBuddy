<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AntigravityBuddy · 设计稿</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* =========================================================
   Tokens — Antigravity 原生暗色体系 + 已校验的数据色板
   ========================================================= */
:root{
  color-scheme: dark;
  --win:#0b0b0c;          /* 窗口底 */
  --side:#131314;         /* 侧栏 */
  --pane:#0f0f10;         /* 主面板 */
  --card:#161618;         /* 卡片 / 图表表面 */
  --card-2:#1b1b1e;       /* 悬停 / 嵌套 */
  --line:rgba(255,255,255,.06);
  --line-2:rgba(255,255,255,.10);
  --grid:#26262a;
  --base:#38383d;

  --ink:#ededee;
  --ink-2:#b4b4ba;
  --ink-3:#7c7c84;
  --ink-4:#55555c;

  --accent:#8b8bf5;       /* 界面强调（延续 Buddy 现有的紫蓝） */
  --accent-wash:rgba(139,139,245,.12);

  /* 数据色板（dark，已在 #161618 上通过 validate_palette） */
  --s1:#3987e5;  /* 新增输入 */
  --s2:#d95926;  /* 输出 */
  --s3:#199e70;  /* 缓存命中 */
  --s1-track:#1a2a40;

  /* 状态色（保留，不作系列色） */
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;

  --r:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","PingFang SC","Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#050506;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:13px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---------- 画廊 ---------- */
.gallery{max-width:1520px;margin:0 auto;padding:56px 40px 120px}
.g-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:40px}
.g-head h1{font-size:28px;font-weight:600;letter-spacing:-.02em}
.g-head p{color:var(--ink-3);margin-top:8px;font-size:14px;line-height:1.6}
.g-nav{display:flex;gap:6px;flex-wrap:wrap}
.g-nav a{color:var(--ink-2);text-decoration:none;padding:6px 12px;border:1px solid var(--line-2);border-radius:999px;font-size:12px}
.g-nav a:hover{background:var(--card)}
.shot{margin-bottom:72px}
.shot-cap{display:flex;gap:14px;align-items:baseline;margin-bottom:14px}
.shot-cap b{font-size:13px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.shot-cap h2{font-size:18px;font-weight:600}
.shot-cap span{color:var(--ink-3);font-size:13px}
body.single .gallery{padding:0;max-width:none}
body.single .g-head,body.single .shot-cap{display:none}
body.single .shot{margin:0}
body.single .win{border-radius:0;box-shadow:none}

/* ---------- Antigravity 窗口外壳 ---------- */
.win{width:1440px;height:900px;background:var(--side);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:300px 1fr;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 80px rgba(0,0,0,.6);position:relative}
.side{background:var(--side);display:flex;flex-direction:column;padding:0 8px 10px}
.tl{height:44px;display:flex;align-items:center;gap:8px;padding-left:12px}
.tl i{width:12px;height:12px;border-radius:50%;display:block}
.tl i:nth-child(1){background:#ff5f57}.tl i:nth-child(2){background:#febc2e}.tl i:nth-child(3){background:#28c840}
.tl .ic{margin-left:22px;display:flex;gap:18px;color:var(--ink-3)}
.newc{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:#1a1a1c;font-size:14px;margin:4px 0 10px}
.nav-i{display:flex;align-items:center;gap:10px;height:34px;padding:0 12px;border-radius:8px;color:var(--ink);font-size:14px}
.nav-i svg{color:var(--ink-3)}
.nav-h{display:flex;justify-content:space-between;align-items:center;color:var(--ink-3);font-size:13px;padding:22px 12px 8px}
.nav-i.on{background:#232326}
.proj{color:var(--ink-3);font-size:14px;display:flex;align-items:center;gap:10px;padding:6px 12px}
.conv{display:flex;justify-content:space-between;align-items:center;padding:7px 12px 7px 40px;font-size:14px;color:var(--ink)}
.conv span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:200px}
.conv em{font-style:normal;color:var(--ink-3);font-size:13px}
.conv .dot{width:6px;height:6px;border-radius:50%;background:#3b82f6}
.side .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:14px}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 14px}
.topbar .t{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.btn-ide{border:1px solid var(--line-2);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--ink)}
.pane{flex:1;margin:0 10px 10px 2px;background:var(--pane);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-height:0}

/* ---------- Buddy 头部 ---------- */
.bh{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 0}
.acct{display:flex;align-items:center;gap:10px}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#5b5bd6,#2a78d6);display:grid;place-items:center;font-size:12px;font-weight:600}
.acct .n{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.acct .e{font-size:12px;color:var(--ink-3)}
.badge{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--accent-wash);color:var(--accent);letter-spacing:.02em}
.chev{color:var(--ink-3)}
.bh-r{display:flex;gap:8px;align-items:center}
.chip{white-space:nowrap;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line-2);border-radius:7px;color:var(--ink-2);font-size:12px;background:transparent}
.chip.solid{background:var(--card)}
.live{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(12,163,12,.18)}
.tabs{display:flex;gap:22px;padding:0 22px;border-bottom:1px solid var(--line);margin-top:12px}
.tabs a{padding:10px 0 11px;font-size:13px;color:var(--ink-3);position:relative;text-decoration:none}
.tabs a.on{color:var(--ink)}
.tabs a.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.body{flex:1;overflow:hidden;padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px;min-height:0}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-h h3{font-size:13px;font-weight:600;color:var(--ink)}
.card-h .sub{font-size:12px;color:var(--ink-3)}
.lbl{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.val{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.val small{font-size:13px;color:var(--ink-3);font-weight:500;letter-spacing:0}
.meta{font-size:12px;color:var(--ink-3);margin-top:8px}
.row{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.seg{display:flex;background:#121214;border:1px solid var(--line);border-radius:7px;padding:2px}
.seg span{padding:3px 10px;font-size:12px;color:var(--ink-3);border-radius:5px}
.seg span.on{background:#26262a;color:var(--ink)}
.meter{height:6px;border-radius:3px;background:var(--s1-track);overflow:hidden}
.meter b{display:block;height:100%;border-radius:3px;background:var(--s1)}
.delta-up{color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2)}
.st i{width:7px;height:7px;border-radius:50%}
.hr{height:1px;background:var(--line);margin:12px 0}
.muted{color:var(--ink-3)}
.r{text-align:right}
svg text{font-family:var(--font)}
.tip{position:fixed;pointer-events:none;background:#232327;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:99;display:none;white-space:nowrap;line-height:1.6}
.hit{cursor:default}
.hit:hover .mk{opacity:.82}
</style>
</head>
<body>
<div class="tip" id="tip"></div>
<div class="gallery">
  <div class="g-head">
    <div>
      <h1>AntigravityBuddy · 设计稿</h1>
      <p>嵌入位置：Antigravity → Extensions → Buddy（FULL_PANE）与对话旁辅助面板（AUX_PANE）<br>
      数据：Token 曲线、会话、调用明细取自本机 <span class="mono">brain/*/transcript.jsonl</span> 真实聚合；模型额度的不同剩余比例为演示状态（实测当前全部 100%）。</p>
    </div>
    <div class="g-nav" id="gnav"></div>
  </div>
  <div id="shots"></div>
</div>

<script>
/* =========================================================
   数据
   ========================================================= */
// 近 24 小时（本地 EST，09:00 → 08:00），来自 transcript.jsonl 实测：[新增输入, 输出, 缓存命中, 调用次数]
const H = [
 [22,760219,119432,24052469,118],[23,507314,78605,33175575,106],
 [0,258089,7617,1841159,9],[1,0,0,0,0],[2,0,0,0,0],[3,0,0,0,0],[4,0,0,0,0],[5,0,0,0,0],[6,0,0,0,0],[7,0,0,0,0],
 [8,506554,75517,22290480,62],[9,845658,154789,32364358,109],[10,678041,86072,22669920,84],[11,615119,35930,6011865,33],
 [12,0,0,0,0],[13,0,0,0,0],[14,0,0,0,0],[15,337901,134527,3211625,49],[16,74525,21206,123957,8],[17,66616,20743,129848,4],
 [18,0,0,0,0],[19,171274,11570,185205,5],[20,913494,25242,1240992,37],[21,96424,2283,261270,4]
];
H.forEach((r,i)=>r[0]=(9+i)%24);
// 每日（本地 EST 实测，数据始于 11-17）
const D = [
 ['11-14',0,0,0,0],['11-15',0,0,0,0],['11-16',0,0,0,0],['11-17',2951220,314893,20415375,215],
 ['11-18',11220054,618426,70799077,300],['11-19',5470239,688777,172352422,637],['11-20',1660234,215571,5152897,107]
];
// 会话（实测前 7，标题对应侧栏）
const S = [
 ['Server Deployment And Fixes','Neox',637,5470239,688777,172352422],
 ['Future Trends And Personal Growth','Neox',213,8240581,388779,53321352],
 ['Neox UI Design Optimization','Neox',110,4734987,301591,20607678],
 ['Casual Greeting','Neox',85,249985,34479,6825074],
 ['Neox Edu Legal Deep Research','Neox',44,219497,35026,5129284],
 ['OA审批队长选择限制排查','KYDev',19,368481,37035,3378381],
 ['工程类型识别与解析','KYDev',30,291642,120609,3134046],
];
const fmt = n => n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(n>=1e8?0:2)+'M':n>=1e3?(n/1e3).toFixed(n>=1e5?0:1)+'K':String(n);
const comma = n => n.toLocaleString('en-US');
const sum = (a,i)=>a.reduce((s,r)=>s+r[i],0);
const T = {in:sum(H,1),out:sum(H,2),cache:sum(H,3),calls:sum(H,4)};
T.real=T.in+T.out; T.total=T.real+T.cache; T.hit=T.cache/(T.cache+T.in);

/* =========================================================
   图标
   ========================================================= */
const I = {
 plus:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>',
 clock:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1.5"/></svg>',
 brief:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="5" width="12" height="8" rx="1.5"/><path d="M6 5V3.5h4V5M2 9h12"/></svg>',
 buddy:'<svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="4" fill="#26264a"/><path d="M5 11V8M8 11V5M11 11V7" stroke="#8b8bf5" stroke-width="1.6" stroke-linecap="round"/></svg>',
 folder:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 4.5V12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H8L6.5 3.5H3a1 1 0 0 0-1 1z"/></svg>',
 gear:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>',
 sync:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13 8a5 5 0 0 1-9 3M3 8a5 5 0 0 1 9-3"/><path d="M12 2v3h-3M4 14v-3h3"/></svg>',
 cal:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>',
 down:'<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6l4 4 4-4"/></svg>',
 filter:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg>',
 newf:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 4.5V12a1 1 0 0 0 1 1h6M2 4.5a1 1 0 0 1 1-1h3.5L8 5h5a1 1 0 0 1 1 1v3"/><path d="M12.5 10.5v4M10.5 12.5h4"/></svg>',
 bell:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1.5H3z"/><path d="M6.5 14h3"/></svg>',
 search:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>',
 export:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 2v8M5 5l3-3 3 3M3 10v3h10v-3"/></svg>',
 warn:'<svg width="12" height="12" viewBox="0 0 16 16"><path d="M8 1.5L15 14H1z" fill="#fab219"/><path d="M8 6v3.5M8 11.5v.5" stroke="#000" stroke-width="1.6" stroke-linecap="round"/></svg>',
 crit:'<svg width="12" height="12" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#d03b3b"/><path d="M8 4.5v4.5M8 11v.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>',
 ok:'<svg width="12" height="12" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#0ca30c"/><path d="M5 8.2l2 2 4-4.2" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>',
 check:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.5 8.5l3 3 6-7"/></svg>',
 bolt:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 1.5L3.5 9H8l-1 5.5L12.5 7H8z"/></svg>',
};

/* =========================================================
   外壳
   ========================================================= */
function sidebar(){
  return `<aside class="side">
    <div class="tl"><i></i><i></i><i></i><div class="ic">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M6 2.5v11"/></svg>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13 8H3M7 4L3 8l4 4"/></svg>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".5"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
    </div></div>
    <div class="newc">${I.plus} New Conversation</div>
    <div class="nav-i">${I.clock} Automations</div>
    <div class="nav-i">${I.brief} Customizations</div>
    <div class="nav-h">Extensions ${I.filter}</div>
    <div class="nav-i on">${I.buddy} Buddy</div>
    <div class="nav-h">Projects <span style="display:flex;gap:12px">${I.filter}${I.newf}</span></div>
    <div class="proj">${I.folder} Neox</div>
    <div class="conv"><span>Server Deployment And Fi...</span><em>::</em></div>
    <div class="conv"><span>Future Trends And Person...</span><i class="dot"></i></div>
    <div class="conv"><span>Neox UI Design Optimizati...</span><em>5h</em></div>
    <div class="conv"><span>Casual Greeting</span><em>9h</em></div>
    <div class="conv"><span>Neox Edu Legal Deep Res...</span><i class="dot"></i></div>
    <div class="proj">${I.folder} KYDev</div>
    <div class="conv"><span>OA审批队长选择限制排查</span><em>2d</em></div>
    <div class="conv"><span>工程类型识别与解析</span><em>2d</em></div>
    <div class="nav-h">Conversations ${I.plus}</div>
    <div class="conv" style="padding-left:12px"><span>General Greeting</span><em>2d</em></div>
    <div class="foot">${I.gear} Settings</div>
  </aside>`;
}
const TABS=[['overview','概览'],['quota','额度'],['tokens','Token 分析'],['ledger','调用明细'],['accounts','账号'],['settings','设置']];
function buddyHead(active, right){
  return `<div class="bh">
    <div class="acct"><div class="av">M</div><div>
      <div class="n">Ming Mike <span class="badge">PRO</span> <span class="chev">${I.down}</span></div>
      <div class="e">lmkbnb1@gmail.com</div></div></div>
    <div class="bh-r">${right||`<div class="chip"><i class="live"></i>实时 · 刚刚同步</div><div class="chip">${I.sync}</div>`}</div>
  </div>
  <nav class="tabs">${TABS.map(([k,v])=>`<a class="${k===active?'on':''}">${v}</a>`).join('')}</nav>`;
}
function windowShell(inner){
  return `<div class="win">${sidebar()}<div class="main">
    <div class="topbar"><div class="t">${I.buddy} Buddy</div><div class="btn-ide">Open IDE</div></div>
    <div class="pane">${inner}</div></div></div>`;
}

/* =========================================================
   图表原语（SVG）
   ========================================================= */
function tipAttr(html){return `data-tip="${html.replace(/"/g,'&quot;')}"`}
// 堆叠柱：rows=[{label, parts:[v...], tip}], colors
function stackedBars({rows,colors,w,h,yMax,yTicks,pad={l:40,r:8,t:8,b:22},barMax=18,xLabelEvery=1,fmtY=n=>n>=1e6?+(n/1e6).toFixed(1)+'M':n>=1e3?+(n/1e3).toFixed(0)+'K':String(n)}){
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b, n=rows.length, band=iw/n, bw=Math.min(barMax,band*.62);
  let g='';
  yTicks.forEach(t=>{const y=pad.t+ih-(t/yMax)*ih;
    g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y}" y2="${y}" stroke="${t===0?'var(--base)':'var(--grid)'}" stroke-width="1"/>`;
    g+=`<text x="${pad.l-8}" y="${y+3.5}" fill="var(--ink-3)" font-size="10.5" text-anchor="end" class="num">${fmtY(t)}</text>`;});
  rows.forEach((r,i)=>{
    const x=pad.l+band*i+(band-bw)/2; let y=pad.t+ih; const tot=r.parts.reduce((a,b)=>a+b,0);
    let segs='';
    const visible=r.parts.map((v,k)=>[v,k]).filter(([v])=>v>0);
    visible.forEach(([v,k],j)=>{
      const hh=Math.max(0,(v/yMax)*ih - (j>0?2:0)); y-=hh+(j>0?2:0);
      const top=j===visible.length-1, rr=top?Math.min(4,hh):0;
      segs+= top
        ? `<path class="mk" d="M${x},${y+hh} V${y+rr} Q${x},${y} ${x+rr},${y} H${x+bw-rr} Q${x+bw},${y} ${x+bw},${y+rr} V${y+hh} Z" fill="${colors[k]}"/>`
        : `<rect class="mk" x="${x}" y="${y}" width="${bw}" height="${hh}" fill="${colors[k]}"/>`;
    });
    if(tot===0) segs=`<rect x="${x}" y="${pad.t+ih-1}" width="${bw}" height="1" fill="var(--base)"/>`;
    g+=`<g class="hit" ${tipAttr(r.tip||'')}><rect x="${pad.l+band*i}" y="${pad.t}" width="${band}" height="${ih}" fill="transparent"/>${segs}</g>`;
    if(i%xLabelEvery===0) g+=`<text x="${x+bw/2}" y="${h-6}" fill="var(--ink-3)" font-size="10.5" text-anchor="middle" class="num">${r.label}</text>`;
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${g}</svg>`;
}
function spark(vals,w,h,color='var(--s1)',fill=true){
  const mx=Math.max(...vals)||1, st=w/(vals.length-1);
  const pts=vals.map((v,i)=>[i*st, h-2-(v/mx)*(h-6)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible">
   ${fill?`<path d="${d} L${w},${h} L0,${h} Z" fill="${color}" opacity=".10"/>`:''}
   <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${color}" stroke="var(--card)" stroke-width="2"/></svg>`;
}
function ring(frac,size,color,track='#232327',stroke=8){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c*frac} ${c}"/></svg>`;
}
// 额度条：fill 按状态着色，track 用同色系暗阶
function qmeter(f,w=120,h=6){

}

        <div style="background:#121214;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--ink-2)">
          <span style="color:#8b8bf5">const</span> port = <span style="color:#8b8bf5">await</span> discoverPort(pid);<br>
          <span style="color:#8b8bf5">if</span> (!port) <span style="color:#8b8bf5">return</span> retryLater(<span style="color:#d95926">3000</span>);<br>

  const aux=`<div style="width:340px;flex:none;display:flex;flex-direction:column;background:#0d0d0e">
    <div style="height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)"><span style="display:flex;gap:8px;align-items:center;font-weight:600">${I.buddy} Buddy</span><span class="st"><i style="background:var(--good)"></i>实时</span></div>

        <div class="legend" style="margin-top:10px;font-size:11.5px"><span><i style="background:var(--s3)"></i>缓存 73.9K</span><span><i style="background:var(--s1)"></i>新增 4.6K</span></div>
      </div>
      <div class="card" style="padding:14px">
        <div style="display:flex;justify-content:space-between"><div class="lbl">本会话累计</div><span class="muted num" style="font-size:12px">110 步</span></div>

          ${[['输入','4.73M'],['输出','302K'],['命中','81%']].map(([k,v])=>`<div><div class="num" style="font-size:16px;font-weight:600">${v}</div><div class="muted" style="font-size:11.5px;margin-top:2px">${k}</div></div>`).join('')}

        <div class="card-h" style="margin-bottom:8px"><span class="lbl">额度</span><span class="muted num" style="font-size:11.5px">3h 53m 后重置</span></div>
        ${[['Neon High · 当前',.18],['Neon XHigh',.62],['Opus 5.5 High',.07],['Hydrogen High',.85]].map(([n,f])=>`<div style="display:grid;grid-template-columns:1fr 70px 34px;gap:8px;align-items:center;padding:5px 0;font-size:12px"><span style="white-space:nowrap">${n}</span>${qmeter(f,70,5)}<span class="num r">${Math.round(f*100)}%</span></div>`).join('')}

        <div style="display:flex;justify-content:space-between;font-size:12px"><span class="muted">Prompt 积分</span><span class="num">500 <span class="muted">/ 50,000</span></span></div>

  return `<div class="win">${sidebar().replace('nav-i on','nav-i').replace('<div class="conv"><span>Neox UI Design Optimizati...','<div class="conv" style="background:#232326;border-radius:8px"><span>Neox UI Design Optimizati...')}<div class="main">
    <div class="topbar"><div class="t" style="font-weight:500">Neox UI Design Optimization <span class="muted" style="font-weight:400;font-size:13px">· Neox</span></div><div style="display:flex;gap:8px"><div class="chip" style="color:var(--accent);border-color:rgba(139,139,245,.4)">${I.buddy} Buddy</div><div class="btn-ide">Open IDE</div></div></div>
    <div class="pane" style="flex-direction:row">${chat}${aux}</div></div></div>`;
}

const SCREENS=[
 ['overview','概览','额度绝对值 + 今日 Token + 最紧张模型 + 耗尽预测，一屏回答「我还能用多少」',scrOverview],
 ['quota','额度','36 个模型按系列分组、状态分级、重置时间线；悬停看模型 ID 与「还能几轮」',scrQuota],
 ['tokens','Token 分析','真实消耗 vs 缓存复用分开看；按模型、活跃时段、命中率趋势',scrTokens],
 ['ledger','调用明细','逐步记录（替代截图里的白底表格），右侧步骤详情含上下文占用',scrLedger],
 ['accounts','账号','多账号额度并列，合计余量，一键切换走官方登录通道',scrAccounts],
 ['aux','辅助面板','AUX_PANE：与对话并排，实时显示本会话上下文、速度、当前模型额度',scrAux],
 ['settings','设置','主题 / 提醒阈值 / 数据入库状态',scrSettings],
];
const q=new URLSearchParams(location.search).get('s');
const list=q?SCREENS.filter(s=>s[0]===q):SCREENS;
if(q) document.body.classList.add('single');
document.getElementById('gnav').innerHTML=SCREENS.map((s,i)=>`<a href="#${s[0]}">${String(i+1).padStart(2,'0')} ${s[1]}</a>`).join('');
document.getElementById('shots').innerHTML=list.map((s)=>`<section class="shot" id="${s[0]}">
  <div class="shot-cap"><b>${String(SCREENS.indexOf(s)+1).padStart(2,'0')}</b><h2>${s[1]}</h2><span>${s[2]}</span></div>${s[3]()}</section>`).join('');

/* tooltip */
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{
  const t=e.target.closest('[data-tip]');
  if(!t||!t.dataset.tip){tip.style.display='none';return;}
  tip.innerHTML=t.dataset.tip; tip.style.display='block';
  const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8), y=e.clientY+14+tip.offsetHeight>innerHeight?e.clientY-tip.offsetHeight-10:e.clientY+14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
});
</script>
