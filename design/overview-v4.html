<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>Buddy 概览 v4</title>
<style>
@font-face{font-family:"Google Sans Flex";src:url(assets/gsflex-latin.woff2) format("woff2");font-weight:100 1000;font-stretch:25% 151%}
@font-face{font-family:"Google Sans Code";src:url(assets/gscode-latin.woff2) format("woff2");font-weight:300 800}
@font-face{font-family:"Material Symbols Outlined";src:url(assets/symbols.woff2) format("woff2");font-weight:300}
@font-face{font-family:"Buddy CJK";src:local("PingFang SC Regular"),local("PingFangSC-Regular");font-weight:100 420;unicode-range:U+2E80-9FFF,U+FF00-FFEF,U+3000-303F}
@font-face{font-family:"Buddy CJK";src:local("PingFang SC Medium"),local("PingFangSC-Medium");font-weight:421 520;unicode-range:U+2E80-9FFF,U+FF00-FFEF,U+3000-303F}
@font-face{font-family:"Buddy CJK";src:local("PingFang SC Semibold"),local("PingFangSC-Semibold");font-weight:521 1000;unicode-range:U+2E80-9FFF,U+FF00-FFEF,U+3000-303F}
:root{--bg:#070708;--border:rgb(255 255 255/.06);--cb:rgb(255 255 255/.08);--hover:rgb(255 255 255/.048);--muted:rgb(255 255 255/.042);--sel:rgb(255 255 255/.075);--track:rgb(255 255 255/.08);
--fg:#fff;--fg2:#BCBDC6;--fg3:#87888F;--fg4:#636470;--primary:#2F71E3;--wash:rgb(47 113 227/.16);--s1:#3987e5;--s2:#d95926;--s3:#199e70;--good:#0ca30c;
--font:"Google Sans Flex","Buddy CJK",system-ui,"PingFang SC",sans-serif;--mono:"Google Sans Code",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:var(--fg);font:350 14px/1.43 var(--font);font-variation-settings:"ROND" 0,"wdth" 92;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}.dim{color:var(--fg3)}.dim2{color:var(--fg4)}.fg2{color:var(--fg2)}
.mono{font-family:var(--mono);font-size:12.5px;font-weight:400;font-variation-settings:normal}
.ms{font-family:"Material Symbols Outlined";font-weight:300;font-style:normal;font-size:18px;line-height:1;display:inline-block;-webkit-font-feature-settings:"liga";vertical-align:middle}
h3{font-size:14px;font-weight:550;font-variation-settings:"ROND" 20,"wdth" 94}
img.lg{width:14px;height:14px;flex:none}
.pane{width:1180px;height:800px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.sub{height:48px;flex:none;display:flex;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:24px}.tabs a{display:flex;align-items:center;color:var(--fg3);position:relative}
.tabs a.on{color:var(--fg);font-weight:450}.tabs a.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--fg)}
.sr{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--fg3)}
.sr .g{width:6px;height:6px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px}
.who{display:flex;align-items:center;gap:7px;color:var(--fg2);font-size:13px}.who i{width:18px;height:18px;border-radius:50%;background:#3b5bdb;display:grid;place-items:center;font:600 10px system-ui;font-style:normal}
.body{flex:1;padding:24px 32px;min-height:0}
.h{display:flex;justify-content:space-between;align-items:center;height:28px;margin-bottom:8px}
.h .x{color:var(--fg3);font-size:12.5px;display:flex;align-items:center;gap:2px}
.hr{height:1px;background:var(--border)}
.bar{height:4px;border-radius:2px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%;border-radius:2px}
/* 洞察 */
.ins{display:flex;gap:12px;padding:9px 10px;margin:0 -10px;border-radius:8px;align-items:flex-start}
.ins .ms{color:var(--fg3);font-size:17px;margin-top:1px}.ins .go{margin-left:auto;color:var(--fg4);font-size:16px}
.ins.hov{background:var(--hover)}
.ins .t{color:var(--fg)}.ins .d{color:var(--fg3);font-size:12.5px;margin-top:2px}
/* 模型行 */
.mr{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;height:32px}
.sw{width:8px;height:8px;border-radius:2px}
/* ===== A ===== */
.pools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pool{padding:12px 14px 13px;border-radius:10px;border:1px solid transparent}
.pool.on{background:var(--muted);border-color:var(--cb)}
.pool .r1{display:flex;align-items:center;gap:8px}.pool .r1 b{margin-left:auto;font-weight:450}
.pool .r3{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg3);margin-top:8px}
.pool .bar{margin-top:10px}
.hero{display:grid;grid-template-columns:300px 1fr;gap:48px;padding:28px 0 26px}
.big{font-size:48px;font-weight:450;letter-spacing:-.025em;line-height:1;font-variation-settings:"ROND" 20,"wdth" 100}
.kv{display:grid;grid-template-columns:auto 1fr;row-gap:12px;column-gap:20px;margin-top:26px}
.kv dt{color:var(--fg3)}.kv dd{text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;background:var(--wash);color:#9cbcf7;font-size:12.5px}
.lowr{display:grid;grid-template-columns:1.35fr 1fr;gap:56px;padding-top:22px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--fg3)}.legend span{display:flex;align-items:center;gap:6px}
/* ===== B ===== */
.kpis{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr}
.kpi{padding:4px 24px 18px;border-left:1px solid var(--border)}.kpi:first-child{padding-left:0;border-left:0}
.kpi .l{color:var(--fg3);font-size:13px;display:flex;align-items:center;gap:6px;height:20px}
.kpi .v{font-size:28px;font-weight:450;letter-spacing:-.02em;margin-top:8px;font-variation-settings:"ROND" 20,"wdth" 100}
.kpi .v small{font-size:13px;color:var(--fg3);font-weight:350;letter-spacing:0;margin-left:6px}
.kpi .s{color:var(--fg3);font-size:12.5px;margin-top:6px}
.kpi.on .v{color:var(--fg)}.kpi.on{position:relative}
.seg{display:inline-flex;border:1px solid var(--cb);border-radius:10px;padding:2px;gap:2px}
.seg span{height:24px;padding:0 10px;border-radius:7px;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg3)}
.seg span.on{background:var(--sel);color:var(--fg)}
.lowb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;padding-top:22px}
</style></head><body>
<div id="root"></div>
<script>
const LG = n => `<img class="lg" src="assets/${n}.svg">`;
const sub = `<div class="sub"><div class="tabs"><a class="on">概览</a><a>额度</a><a>用量</a><a>明细</a><a>账号</a><a>设置</a></div><div class="sr"><span><i class="g"></i>10:08 已同步</span><span class="who"><i>M</i>lmkbnb1</span></div></div>`;

// 累计花费曲线（07:00 → 12:00，当前 10:08）
function chart(W, H, opt = {}) {
  const pts = [[0,0],[.12,0],[.16,.02],[.2,.12],[.23,.33],[.27,.36],[.31,.37],[.4,.38],[.44,.42],[.5,.44],[.6,.44],[.63,.44]];
  const cap = 25, used = 4.94, scale = v => H - 22 - v * (H - 44) ;
  const y = f => scale(f * used / cap * (cap / 25)), xx = f => f * W;
  // y 轴以估算上限 $25 为满刻度
  const Y = d => H - 22 - d / cap * (H - 44);
  const line = pts.map(([f, u], i) => `${i ? 'L' : 'M'}${xx(f).toFixed(1)},${Y(u * 11.2).toFixed(1)}`).join(' ');
  const end = pts[pts.length - 1], ex = xx(end[0]), ey = Y(end[1] * 11.2), py = Y(8.0);
  const grid = [0, 12.5, 25].map(v => `<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgb(255 255 255/${v === 25 ? .14 : .05})" ${v === 25 ? 'stroke-dasharray="3 4"' : ''}/>`).join('');
  const hrs = ['07:00','08:00','09:00','10:00','11:00','12:00'].map((t, i) => `<text x="${i === 5 ? W : i * W / 5}" y="${H - 4}" text-anchor="${i === 0 ? 'start' : i === 5 ? 'end' : 'middle'}">${t}</text>`).join('');
  return `<svg width="${W}" height="${H}" style="display:block;overflow:visible;font:12px var(--font);fill:var(--fg4)">
    <defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3987e5" stop-opacity=".28"/><stop offset="1" stop-color="#3987e5" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <text x="${W}" y="${Y(25) - 7}" text-anchor="end">估算上限 $25.0</text>
    <path d="${line} L${ex},${Y(0)} L0,${Y(0)} Z" fill="url(#gf)"/>
    <path d="${line}" fill="none" stroke="#3987e5" stroke-width="1.75" stroke-linejoin="round"/>
    <path d="M${ex},${ey} L${W},${py}" stroke="#3987e5" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 4" fill="none"/>
    <line x1="${ex}" x2="${ex}" y1="16" y2="${Y(0)}" stroke="rgb(255 255 255/.12)"/>
    <circle cx="${ex}" cy="${ey}" r="4" fill="#3987e5" stroke="var(--bg)" stroke-width="2"/>
    <text x="${ex + 8}" y="${ey - 10}" style="fill:var(--fg2)">现在 $4.94</text>
    <circle cx="${W}" cy="${py}" r="3" fill="none" stroke="#3987e5" stroke-opacity=".7"/>
    <text x="${W - 6}" y="${py - 10}" text-anchor="end" style="fill:var(--fg3)">12:00 预计 $8.0</text>
    ${hrs}</svg>`;
}
const INS = [
  ['forum','「Casual Greeting」占了 64% 的真实消耗','389 次调用 · 3.78M tokens'],
  ['cached','5 次调用没命中缓存，单次输入超过 100K','共 1.33M 新增输入，是这段时间最贵的调用'],
  ['trending_down','近 6 小时缓存命中率 60%，低于平均 96%','通常是新开会话或上下文被压缩'],
  ['hub','4 个子代理用了 60.2K tokens','已计入各自的父会话'],
];
const insights = (n = 4, hov = 0) => INS.slice(0, n).map(([i, t, d], k) => `<div class="ins ${k === hov ? 'hov' : ''}"><span class="ms">${i}</span><div style="min-width:0"><div class="t">${t}</div><div class="d num">${d}</div></div><span class="ms go">chevron_right</span></div>`).join('');
const MODELS = [['gemini','gemini-4-neon','$61.9','var(--s1)'],['gemini','gemini-4-carbon','$42.7','var(--s2)'],['claude','claude-opus-4-6-thinking','$2.29','var(--s3)']];
const stack = `<div style="display:flex;gap:2px;height:6px;margin:14px 0 6px">${[[55.8,'var(--s1)'],[38.5,'var(--s2)'],[2.1,'var(--s3)'],[3.6,'#4a4b55']].map(([w,c])=>`<i style="width:${w}%;background:${c};border-radius:2px"></i>`).join('')}</div>`;
const models = MODELS.map(([l, n, v, c]) => `<div class="mr"><span class="sw" style="background:${c}"></span><span class="row" style="display:flex;align-items:center;gap:8px">${LG(l)}<span class="mono fg2">${n}</span></span><span class="num">${v}</span></div>`).join('') + `<div class="mr"><span class="sw" style="background:#4a4b55"></span><span class="dim">其他 4 个模型</span><span class="num dim">$3.92</span></div>`;
const month = (head = true, today = true) => `${head ? `<div class="h"><h3>本月</h3><span class="x">用量<span class="ms" style="font-size:16px">chevron_right</span></span></div>` : ''}
  <div style="display:flex;align-items:baseline;gap:10px"><span style="font-size:28px;font-weight:450;letter-spacing:-.02em">$111</span><span class="dim num">1,275 次调用</span>${today ? `<span class="dim num" style="margin-left:auto">今天 <span class="fg2">$10.1</span> · 123 次</span>` : ''}</div>
  ${stack}${models}`;

// ===== 方案 A：额度池当选择器放顶部，下面是选中池的详情 =====
function A() {
  const P = [
    ['gemini','5 小时 · Gemini','80%','.8','var(--s1)','还剩 $20.0','12:00 重置 · 1h 52m',1],
    ['claude','5 小时 · Claude / GPT','100%','1','rgb(255 255 255/.32)','未使用 · 7 个模型','',0],
    ['gemini','每周 · Gemini','100%','1','rgb(255 255 255/.32)','未使用 · 4 个模型','',0],
  ];
  return `<div class="pane">${sub}<div class="body">
  <div class="pools">${P.map(([l,n,p,f,c,a,b,on]) => `<div class="pool ${on?'on':''}"><div class="r1">${l==='claude'?LG('claude')+LG('openai'):LG(l)}<span class="${on?'':'fg2'}">${n}</span><b class="num ${on?'':'dim'}">${p}</b></div><div class="bar"><i style="width:${f*100}%;background:${c}"></i></div><div class="r3 num"><span>${a}</span><span>${b}</span></div></div>`).join('')}</div>
  <div class="hero">
    <div>
      <div class="dim" style="font-size:13px">5 小时额度 · Gemini · 还剩</div>
      <div style="display:flex;align-items:baseline;gap:10px;margin-top:10px"><span class="big num">$20.0</span><span class="dim num">/ 约 $25.0</span></div>
      <div class="dim num" style="margin-top:8px">约 57.5M tokens</div>
      <dl class="kv num">
        <dt>已用</dt><dd>$4.94 <span class="dim">· 20%</span></dd>
        <dt>重置</dt><dd>12:00 <span class="dim">· 还有 1h 52m</span></dd>
        <dt>当前速度</dt><dd>$0.98 <span class="dim">/ 小时</span></dd>
      </dl>
      <div style="margin-top:22px"><span class="chip"><span class="ms" style="font-size:15px">check_circle</span>按当前速度，重置前只会用到 32%</span></div>
    </div>
    <div>
      <div class="h" style="margin-bottom:14px"><h3>本窗口累计花费</h3><div class="legend"><span><i style="width:10px;height:2px;background:#3987e5"></i>已花</span><span><i style="width:10px;border-top:1.5px dashed #3987e5"></i>按当前速度外推</span></div></div>
      ${chart(724, 236)}
    </div>
  </div>
  <div class="hr"></div>
  <div class="lowr">
    <div><div class="h"><h3>洞察</h3><span class="x">近 24 小时</span></div>${insights(4, 0)}</div>
    <div>${month()}</div>
  </div>
  </div></div>`;
}

// ===== 方案 B：顶部一行 KPI（数字本身即切换器），下面大图 + 三栏 =====
function B() {
  return `<div class="pane">${sub}<div class="body">
  <div class="kpis">
    <div class="kpi on"><div class="l">${LG('gemini')}5 小时 · Gemini</div><div class="v num">$20.0<small>还剩 · 80%</small></div><div class="bar" style="margin-top:12px"><i style="width:80%;background:var(--s1)"></i></div><div class="s num">12:00 重置 · 1h 52m</div></div>
    <div class="kpi"><div class="l">${LG('claude')}${LG('openai')}5 小时 · Claude / GPT</div><div class="v num">100%<small>未使用</small></div><div class="bar" style="margin-top:12px"><i style="width:100%;background:rgb(255 255 255/.28)"></i></div><div class="s">7 个模型</div></div>
    <div class="kpi"><div class="l">${LG('gemini')}每周 · Gemini</div><div class="v num">100%<small>未使用</small></div><div class="bar" style="margin-top:12px"><i style="width:100%;background:rgb(255 255 255/.28)"></i></div><div class="s">4 个模型</div></div>
    <div class="kpi"><div class="l"><span class="ms" style="font-size:15px;color:var(--fg3)">calendar_today</span>今天</div><div class="v num">$10.1<small>123 次</small></div><div style="height:4px;margin-top:12px"></div><div class="s num">本月 $111 · 1,275 次</div></div>
  </div>
  <div class="hr"></div>
  <div style="padding:22px 0 24px">
    <div class="h" style="margin-bottom:14px"><div style="display:flex;align-items:baseline;gap:12px"><h3>5 小时 · Gemini</h3><span class="dim num">已花 $4.94 / 约 $25.0 · 按当前速度重置前用到 32%</span></div><div class="seg"><span class="on">花费</span><span>Tokens</span><span>调用</span></div></div>
    ${chart(1116, 214)}
  </div>
  <div class="hr"></div>
  <div class="lowb" style="grid-template-columns:1.25fr 1fr;gap:56px">
    <div><div class="h"><h3>洞察</h3><span class="x">近 24 小时</span></div>${insights(3, -1)}</div>
    <div>${month(true, false)}</div>
  </div>
  </div></div>`;
}
const v = new URLSearchParams(location.search).get('v') || 'A';
document.getElementById('root').innerHTML = v === 'B' ? B() : A();
</script></body></html>
